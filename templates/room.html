<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
<title>Room — {{ room }}</title>
<link rel="stylesheet" href="/static/css/style.css">
</head>

<body>

<div class="chat-wrapper">
<div class="chat-container">

    <div class="header">
        <div class="header-bar">
            <span>✉️ Private Room — Live session</span>
            <span>🔒 Secure</span>
        </div>
        <div class="header-meta">
            <div class="header-room">{{ room }}</div>
            <div id="names"></div>
        </div>
    </div>

    <div class="messages" id="messages"></div>

    <div class="input-area">
        <span class="input-prompt">{{ name }}</span>
        <input type="file" id="imageInput" accept="image/*" hidden>
        <label for="imageInput" class="upload-icon" title="Attach image">
            <img src="/static/images/photo.png" id="previewImage" alt="Upload">
        </label>
        <input type="text" id="message" placeholder="Write something..." autocomplete="off" spellcheck="false">
        <button onclick="handleSend()">Send →</button>
    </div>

</div>
</div>

<script>
var socket = io();
const currentRoom = "{{ room }}";
const messages = document.getElementById('messages');
const names = document.getElementById('names');
const myName = "{{ name }}";

const createMessage = (name, msg, isImage = false) => {
    const isMe = name === myName;

    const wrapper = document.createElement("div");
    wrapper.classList.add("message", isMe ? "sent" : "received");

    const bubble = document.createElement("div");
    bubble.classList.add("msg-bubble");

    let inner = '';
    if (!isMe) {
        inner += `<div class="username">${name}</div>`;
    }
    inner += `<div>${isImage ? `<img src="${msg}" class="chat-image" onclick="window.open('${msg}','_blank')">` : msg}</div>`;
    inner += `<div class="meta">${new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}</div>`;

    bubble.innerHTML = inner;
    wrapper.appendChild(bubble);
    messages.appendChild(wrapper);
    messages.scrollTop = messages.scrollHeight;
};

socket.on('message', function(data) {
    names.textContent = data.names;
    createMessage(data.name, data.message);
});

const sendmessage = () => {
    const input = document.getElementById('message');
    if (input.value.trim() === "") return;
    socket.emit("message", { data: input.value });
    input.value = "";
};

document.getElementById("message").addEventListener("keydown", function(e) {
    if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        handleSend();
    }
});

function sendImage() {
    let fileInput = document.getElementById("imageInput");
    let file = fileInput.files[0];
    if (!file) return;

    let formData = new FormData();
    formData.append("image", file);

    fetch("/upload", { method: "POST", body: formData })
        .then(res => res.json())
        .then(data => {
            socket.emit("send_image", { url: data.url, room: currentRoom });
        });

    fileInput.value = "";
    document.getElementById("previewImage").src = "/static/images/photo.png";
}

socket.on("receive_image", function(data) {
    createMessage(data.name, data.image, true);
});

const input = document.getElementById("imageInput");
const preview = document.getElementById("previewImage");
input.addEventListener("change", function () {
    const file = this.files[0];
    if (file) preview.src = URL.createObjectURL(file);
});

function handleSend() {
    sendmessage();
    sendImage();
}
</script>

{% for msg in messages %}
<script>
    {% if msg.image %}
        createMessage("{{ msg.name }}", "{{ msg.image }}", true);
    {% else %}
        createMessage("{{ msg.name }}", "{{ msg.message }}");
    {% endif %}
</script>
{% endfor %}

</body>
</html>
